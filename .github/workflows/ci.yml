name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # `verify` runs unit tests, then the Testcontainers suite against the
      # runner's Docker daemon: real Postgres, Redis and Kafka.
      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t transaction-service:${{ github.sha }} .
